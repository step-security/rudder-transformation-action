[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
reason = """
sprintf-js@1.0.3 is a transitive dev-only dependency pulled in through the chain
jest -> babel-plugin-istanbul -> @istanbuljs/load-nyc-config -> js-yaml@3.x -> argparse@1.x -> sprintf-js.
It is never bundled into dist/index.js and has no runtime exposure in the published action.
No fixed version is available for this vulnerability, and none of the intermediate packages
(argparse@1.x, js-yaml@3.x) declare a compatible upgrade path to sprintf-js@1.1.3.
Risk is accepted as dev-environment only.
"""
